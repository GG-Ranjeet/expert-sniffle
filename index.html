<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Core Theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
    <!-- Core Dark Add-on (defaults to system preference) -->
    <link id="dark-theme" rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css" media="(prefers-color-scheme: dark)">
    <!-- KaTeX CSS for LaTeX Math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <style>
      :root {
        --content-max-width: min(92%, 1150px);
      }

      .markdown-section {
        max-width: var(--content-max-width);
        width: 100%;
      }

      .mermaid {
        display: flex;
        justify-content: center;
        margin: 1.25rem 0;
        overflow-x: auto;
      }

      #theme-toggle {
        position: fixed;
        top: 14px;
        right: 18px;
        z-index: 1000;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(128, 128, 128, 0.35);
        background: rgba(128, 128, 128, 0.12);
        color: inherit;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(8px);
      }
      #theme-toggle:hover {
        background: rgba(128, 128, 128, 0.24);
      }
    </style>
  </head>
  <body class="loading">
    <button id="theme-toggle" type="button" title="Switch theme (System / Dark / Light)">Theme: System</button>
    <div id="app"></div>

    <!-- Configuration -->
    <script>
      function isDarkActive() {
        const mode = localStorage.getItem('docsify-theme-mode') || 'system';
        if (mode === 'dark') return true;
        if (mode === 'light') return false;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      window.$docsify = {
        plugins: [
          function (hook) {
            hook.doneEach(function () {
              const container = document.querySelector('.markdown-section');
              if (!container) return;

              // Render LaTeX math ($...$ and $$...$$) via KaTeX
              if (window.renderMathInElement) {
                window.renderMathInElement(container, {
                  delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '\\[', right: '\\]', display: true }
                  ],
                  throwOnError: false
                });
              }

              // Render Mermaid diagrams
              if (window.mermaid) {
                const blocks = container.querySelectorAll('pre[data-lang="mermaid"]');
                blocks.forEach(function (pre) {
                  const code = pre.querySelector('code');
                  const div = document.createElement('div');
                  div.className = 'mermaid';
                  div.textContent = code ? code.textContent : pre.textContent;
                  pre.replaceWith(div);
                });
                if (blocks.length > 0) {
                  window.mermaid.initialize({
                    startOnLoad: false,
                    theme: isDarkActive() ? 'dark' : 'default'
                  });
                  window.mermaid.run({ querySelector: '.mermaid' });
                }
              }
            });
          }
        ]
      };

      (function () {
        const modes = ['system', 'dark', 'light'];
        const labels = { system: 'Theme: System', dark: 'Theme: Dark', light: 'Theme: Light' };
        const mediaMap = {
          system: '(prefers-color-scheme: dark)',
          dark: 'all',
          light: 'not all'
        };

        const link = document.getElementById('dark-theme');
        const btn = document.getElementById('theme-toggle');

        function applyTheme(mode) {
          if (!modes.includes(mode)) mode = 'system';
          link.media = mediaMap[mode];
          btn.textContent = labels[mode];
          localStorage.setItem('docsify-theme-mode', mode);
        }

        const saved = localStorage.getItem('docsify-theme-mode') || 'system';
        applyTheme(saved);

        btn.addEventListener('click', function () {
          const current = localStorage.getItem('docsify-theme-mode') || 'system';
          const next = modes[(modes.indexOf(current) + 1) % modes.length];
          applyTheme(next);
        });
      })();
    </script>

    <!-- Docsify.js -->
    <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>

    <!-- KaTeX JS & Auto-Render -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Mermaid JS -->
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
      window.mermaid = mermaid;
      if (document.querySelector('pre[data-lang="mermaid"]')) {
        mermaid.initialize({ startOnLoad: false, theme: isDarkActive() ? 'dark' : 'default' });
        document.querySelectorAll('pre[data-lang="mermaid"]').forEach(function (pre) {
          const code = pre.querySelector('code');
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = code ? code.textContent : pre.textContent;
          pre.replaceWith(div);
        });
        mermaid.run({ querySelector: '.mermaid' });
      }
    </script>
  </body>
</html>
